<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Revolut">
<meta name="theme-color" content="#9e2fed">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.json">
<title>Revolut</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#31317a}

/*
  Container pinned to bottom of screen.
  Image fills width, height is natural (auto).
  If viewport is shorter than image, top overflows upward (hidden).
  Tab bar at the bottom is always visible.
  Overlays use % of container height = % of image height.
*/
.container{
  position:fixed;
  bottom:calc(-1 * env(safe-area-inset-bottom, 34px));
  left:0;right:0;
  max-width:393px;
  margin:0 auto;
  background:#31317a;
  padding-bottom:env(safe-area-inset-bottom, 34px);
}
.container img{
  width:100%;
  height:auto;
  display:block;
}

/* Text overlays — positioned as % of image height (container height) */
.label-text{
  position:absolute;
  top:23.4%;
  left:0;width:100%;
  z-index:10;
  pointer-events:none;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  font-size:14px;
  font-weight:400;
  color:rgba(255,255,255,0.75);
  text-align:center;
  letter-spacing:0.2px;
}
.balance-text{
  position:absolute;
  top:26.3%;
  left:0;width:100%;
  z-index:10;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  font-size:44px;
  font-weight:700;
  color:#fff;
  letter-spacing:-0.5px;
  line-height:1;
  text-align:center;
  white-space:nowrap;
  cursor:pointer;
}
.balance-text .dec{
  font-size:26px;
  font-weight:600;
  vertical-align:top;
  position:relative;
  top:2px;
  letter-spacing:0;
}
.iban-text{
  position:absolute;
  top:31.8%;
  left:0;width:100%;
  z-index:10;
  pointer-events:none;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  font-size:14px;
  font-weight:400;
  color:rgba(255,255,255,0.8);
  text-align:center;
  letter-spacing:0.3px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.modal-overlay{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  z-index:100;
  align-items:center;
  justify-content:center;
}
.modal-overlay.show{display:flex}
.modal{
  background:#2E1B55;
  border-radius:20px;
  padding:28px 24px;
  width:85%;max-width:340px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.1);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
}
.modal h3{font-size:18px;font-weight:600;margin-bottom:20px;color:#fff}
.modal input{
  width:100%;
  background:rgba(255,255,255,0.08);
  border:1.5px solid rgba(255,255,255,0.2);
  border-radius:12px;
  padding:14px 16px;
  font-size:28px;font-weight:400;
  color:#fff;text-align:center;
  outline:none;-webkit-appearance:none;
  font-family:inherit;
}
.modal input:focus{border-color:rgba(255,255,255,0.45)}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.modal-btns button{
  flex:1;padding:14px;border-radius:12px;border:none;
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
}
.btn-cancel{background:rgba(255,255,255,0.1);color:#fff}
.btn-save{background:#fff;color:#1a0a2e}
</style>
</head>
<body>

<div class="container">
  <img src="bg.png" alt="" draggable="false"/>
  <div class="label-text">Personal · EUR</div>
  <div class="balance-text" id="balText" onclick="openModal()">€<span id="balMain">21</span><span class="dec">.<span id="balDec">60</span></span></div>
  <div class="iban-text">
    <svg width="16" height="16" fill="rgba(255,255,255,0.75)" viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm0-4h2v-6H3v6zm4 0h2v-6H7v6zm4 0h2v-6h-2v6zm4 0h2v-6h-2v6zm4 0h2v-6h-2v6zM2 9l10-5 10 5v2H2V9z"/></svg>
    <span>NL75 REVO 0942 7692 05</span>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Set Balance</h3>
    <input type="text" id="balanceInput" inputmode="decimal" placeholder="0.00" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveBalance()">Save</button>
    </div>
  </div>
</div>

<script>
var currentBalance=21.60;

function openModal(){
  document.getElementById('balanceInput').value=currentBalance.toFixed(2);
  document.getElementById('modal').classList.add('show');
  setTimeout(function(){document.getElementById('balanceInput').focus()},100);
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
}
function saveBalance(){
  var val=document.getElementById('balanceInput').value.replace(/[^0-9.]/g,'');
  if(!val){closeModal();return}
  currentBalance=parseFloat(parseFloat(val).toFixed(2));
  var parts=currentBalance.toFixed(2).split('.');
  document.getElementById('balMain').textContent=parseInt(parts[0]).toLocaleString('en');
  document.getElementById('balDec').textContent=parts[1];
  closeModal();
}
document.getElementById('modal').addEventListener('click',function(e){
  if(e.target===this)closeModal();
});
document.getElementById('balanceInput').addEventListener('keydown',function(e){
  if(e.key==='Enter')saveBalance();
});
</script>

</body>
</html>
