<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Revolut">
<meta name="theme-color" content="#AD1FF6">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.json">
<title>Revolut</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  overflow: hidden;
  background: #1a0a2e;
}
body {
  max-width: 393px;
  margin: 0 auto;
  height: 100vh;
  height: 100dvh;
  position: relative;
}
.bg {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: top center;
}
.balance-overlay {
  position: absolute;
  top: 15.2%;
  left: 50%;
  transform: translateX(-50%);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  font-size: 54px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -1px;
  line-height: 1;
  text-align: center;
  z-index: 10;
  cursor: pointer;
  padding: 6px 20px;
  background: linear-gradient(180deg, #8C44F5 0%, #7E4AF0 100%);
  border-radius: 8px;
}
.balance-overlay .decimal {
  font-size: 30px;
  font-weight: 600;
  vertical-align: top;
  position: relative;
  top: 4px;
  letter-spacing: 0;
}
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #2E1B55;
  border-radius: 20px;
  padding: 28px 24px;
  width: 85%;
  max-width: 340px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.1);
}
.modal h3 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 20px;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
}
.modal input {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border: 1.5px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 28px;
  font-weight: 400;
  color: #fff;
  text-align: center;
  outline: none;
  -webkit-appearance: none;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
}
.modal input:focus { border-color: rgba(255,255,255,0.45); }
.modal-btns {
  display: flex; gap: 10px;
  margin-top: 20px;
}
.modal-btns button {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
}
.btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
.btn-save { background: #fff; color: #1a0a2e; }
</style>
</head>
<body>

<img src="bg.png" class="bg" alt="" draggable="false" />

<div class="balance-overlay" id="balanceDisplay" onclick="openModal()">€<span id="balMain">21</span><span class="decimal">.<span id="balDec">60</span></span></div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Set Balance</h3>
    <input type="text" id="balanceInput" inputmode="decimal" placeholder="0.00" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveBalance()">Save</button>
    </div>
  </div>
</div>

<script>
var currentBalance = 21.60;
function openModal() {
  document.getElementById('balanceInput').value = currentBalance.toFixed(2);
  document.getElementById('modal').classList.add('show');
  setTimeout(function(){ document.getElementById('balanceInput').focus(); }, 100);
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
}
function saveBalance() {
  var val = document.getElementById('balanceInput').value.replace(/[^0-9.]/g, '');
  if (!val) { closeModal(); return; }
  currentBalance = parseFloat(parseFloat(val).toFixed(2));
  var parts = currentBalance.toFixed(2).split('.');
  document.getElementById('balMain').textContent = parseInt(parts[0]).toLocaleString('en');
  document.getElementById('balDec').textContent = parts[1];
  closeModal();
}
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('balanceInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') saveBalance();
});
</script>

</body>
</html>
